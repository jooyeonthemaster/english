<rect x="84" y="894" width="1752" height="86" rx="8" fill="#f6f8fb" stroke="#d9e2ef" filter="none"/>
<text x="112" y="928" font-size="23" font-weight="950" fill="#111827">읽는 순서</text>
<text x="112" y="962" font-size="20" font-weight="750" fill="#718096">시작하기에서 공통 UI를 보고, 각 기능 인트로 → 실제 클릭 단계 → 팁 순서로 따라갑니다. 마지막 빠른 가이드에서 핵심 4기능을 다시 정리합니다.</text>
