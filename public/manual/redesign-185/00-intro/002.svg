</defs><rect width="1920" height="1080" fill="#ffffff"/>
<text x="84" y="88" font-size="28" font-weight="950" fill="#1f5df5">전체 목차</text>
<text font-size="58" font-weight="950" fill="#111827" letter-spacing="0"><tspan x="84" y="164">12개 기능을 결과 중심으로 훑어봅니다</tspan></text>


<rect x="84" y="286" width="410" height="126" rx="8" fill="#ffffff" stroke="#d9e2ef" filter="url(#cardShadow)"/>
