<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" font-family="Apple SD Gothic Neo, Malgun Gothic, -apple-system, BlinkMacSystemFont, sans-serif">
<rect width="1920" height="1080" fill="#f6f8fb"/>
<rect x="0" y="0" width="1920" height="10" fill="url(#topGrad)"/>
<defs>
  <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1f5df5"/>
    <stop offset="0.47" stop-color="#12b886"/>
    <stop offset="1" stop-color="#f59f00"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#1e293b" flood-opacity="0.14"/>
  </filter>
  <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1e293b" flood-opacity="0.08"/>
  </filter>
</defs><rect width="1920" height="1080" fill="#ffffff"/>
<text x="84" y="88" font-size="28" font-weight="950" fill="#1f5df5">보는 방법</text>
<text font-size="58" font-weight="950" fill="#111827" letter-spacing="0"><tspan x="84" y="164">화면 캡처와 번호만 따라가면 됩니다</tspan></text>


<rect x="84" y="304" width="970" height="112" rx="8" fill="#ffffff" stroke="#d9e2ef" filter="url(#cardShadow)"/>
<text x="124" y="346" font-size="28" font-weight="950" fill="#111827">파란 박스 + 번호</text>
<text font-size="20" font-weight="750" fill="#718096"><tspan x="124" y="380">해당 단계에서 클릭할 버튼·영역입니다. 번호 순서대로 따라 하세요. 버튼 문구는 실제 화면 그대로입니다.</tspan></text>
<rect x="1200" y="326" width="320" height="68" rx="8" fill="#ffffff" stroke="#d9e2ef" filter="none"/>
<text x="1360" y="369" text-anchor="middle" font-size="24" font-weight="850" fill="#243247">다음으로</text>
<rect x="1194" y="320" width="332" height="80" rx="12" fill="none" stroke="#1f5df5" stroke-width="5"/>
<circle cx="1192" cy="318" r="20" fill="#1f5df5"/>
<text x="1192" y="326" text-anchor="middle" font-size="22" font-weight="900" fill="#ffffff">1</text><rect x="84" y="454" width="970" height="112" rx="8" fill="#ffffff" stroke="#d9e2ef" filter="url(#cardShadow)"/>
<text x="124" y="496" font-size="28" font-weight="950" fill="#111827">크레딧 칩(◈)</text>
<text x="124" y="530" font-size="20" font-weight="750" fill="#718096">크레딧이 차감되는 동작입니다. 버튼 옆 숫자를 먼저 확인합니다.</text>
<rect x="1200" y="476" width="178" height="68" rx="8" fill="#eaf1ff" stroke="#c7d6f7" filter="none"/>
<text x="1250" y="520" font-size="28" font-weight="950" fill="#1f5df5">◈</text>
<text x="1308" y="520" font-size="28" font-weight="950" fill="#1f5df5">5</text><rect x="84" y="604" width="970" height="112" rx="8" fill="#ffffff" stroke="#d9e2ef" filter="url(#cardShadow)"/>
<text x="124" y="646" font-size="28" font-weight="950" fill="#111827">오른쪽 설명 패널</text>
<text x="124" y="680" font-size="20" font-weight="750" fill="#718096">화면 위에는 번호만 두고, 자세한 설명은 오른쪽에 고정합니다.</text>
<rect x="1200" y="626" width="430" height="80" rx="8" fill="#ffffff" stroke="#d9e2ef" filter="none"/>
<rect x="1224" y="646" width="54" height="40" rx="20" fill="#1f5df5"/>
<text x="1251" y="673" text-anchor="middle" font-size="18" font-weight="950" fill="#ffffff">1</text>
<text x="1300" y="664" font-size="23" font-weight="950" fill="#111827">사용자가 해야 할 일</text>
<text x="1300" y="688" font-size="15" font-weight="800" fill="#718096">오른쪽에서 요약과 세부 설명을 확인</text><rect x="84" y="754" width="970" height="112" rx="8" fill="#ffffff" stroke="#d9e2ef" filter="url(#cardShadow)"/>
<text x="124" y="796" font-size="28" font-weight="950" fill="#111827">개인정보 마스킹</text>
<text x="124" y="830" font-size="20" font-weight="750" fill="#718096">이메일·연락처·주문번호는 예시 값으로 대체합니다.</text>
<rect x="1200" y="776" width="430" height="68" rx="8" fill="#ffffff" stroke="#d9e2ef" filter="none"/>
<text x="1224" y="819" font-size="23" font-weight="850" fill="#718096">director@example.com</text>
</svg>
