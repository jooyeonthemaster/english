<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><title>SMOAT 리디자인 매뉴얼 검수 뷰어</title>
<style>
:root{--blue:#1f5df5;}*{box-sizing:border-box}
body{font-family:Apple SD Gothic Neo, Malgun Gothic, -apple-system, BlinkMacSystemFont, sans-serif;background:#0b1220;margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:10px 18px 6px;background:#111a2e;color:#e2e8f0;font-size:14px}
header .num{font-size:18px;font-weight:900;color:#7aa2ff;min-width:96px}
header .chip{display:inline-flex;align-items:center;background:var(--blue);color:#fff;font-weight:900;font-size:14px;padding:5px 12px;border-radius:999px;white-space:nowrap}
header .step{font-size:13px;color:#9fb3d1;font-weight:800}
header .title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cbd5e1}
header .file{font-family:monospace;font-size:12px;color:#64748b}
header input{width:60px;background:#0b1220;border:1px solid #334155;color:#e2e8f0;border-radius:6px;padding:4px 6px;font-size:13px;text-align:center}
header button{background:#25324a;border:none;color:#e2e8f0;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
header button:hover{background:#33425f}.segs{display:flex;gap:4px;padding:4px 18px 10px;background:#111a2e}
.seg{position:relative;height:9px;border-radius:6px;background:#22304d;overflow:hidden;cursor:pointer}.seg .fill{position:absolute;inset:0;width:0;background:#3f5578;transition:width .18s ease}
.seg.done .fill{width:100%;background:#4b6bd6}.seg.cur .fill{background:var(--blue)}
.seg .lab{position:absolute;left:6px;top:-19px;font-size:11px;font-weight:900;color:#7c8db0;white-space:nowrap;pointer-events:none;opacity:0}.seg.cur .lab,.seg:hover .lab{opacity:1;color:#a9c0ff}
main{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;overflow:hidden}
main img{max-width:96%;max-height:96%;background:#fff;border-radius:8px;box-shadow:0 10px 50px rgba(0,0,0,.55)}
main img.anim-next{animation:slideNext .22s cubic-bezier(.2,.7,.2,1)}main img.anim-prev{animation:slidePrev .22s cubic-bezier(.2,.7,.2,1)}
@keyframes slideNext{from{opacity:.2;transform:translateX(48px) scale(.985)}to{opacity:1;transform:none}}@keyframes slidePrev{from{opacity:.2;transform:translateX(-48px) scale(.985)}to{opacity:1;transform:none}}
.nav{position:absolute;top:0;bottom:0;width:16%;cursor:pointer;opacity:0;transition:opacity .15s;display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;user-select:none}.nav:hover{opacity:.5}.nav.prev{left:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}.nav.next{right:0;background:linear-gradient(-90deg,rgba(0,0,0,.35),transparent)}
footer{padding:7px 18px;background:#111a2e;color:#64748b;font-size:12px;display:flex;align-items:center;gap:16px}footer .bar{flex:1;height:5px;border-radius:3px;background:#22304d;overflow:hidden}footer .bar>i{display:block;height:100%;background:var(--blue);width:0;transition:width .18s}
</style></head><body>
<header><span class="num" id="num"></span><span class="chip" id="chip"></span><span class="step" id="step"></span><span class="title" id="title"></span><span class="file" id="file"></span><input id="jump" type="number" min="1"/><button onclick="go(+document.getElementById('jump').value-1)">이동</button><button onclick="go(idx-1)">←</button><button onclick="go(idx+1)">→</button></header>
<div class="segs" id="segs"></div><main><div class="nav prev" onclick="go(idx-1)">‹</div><img id="img" alt=""/><div class="nav next" onclick="go(idx+1)">›</div></main>
<footer><span>←/→ · 스페이스로 넘기기 · 세그먼트 클릭 = 기능 처음으로</span><span class="bar"><i id="allbar"></i></span></footer>

const segEls=[...segsEl.children];let idx=Math.min(Math.max(0,+(localStorage.getItem("smoat-redesign-review-idx")||0)),SLIDES.length-1);
function curGroup(i){let g=GROUPS[0],k=0;for(let j=0;j<GROUPS.length;j++){if(i>=GROUPS[j].start){g=GROUPS[j];k=j;}}return {g,k};}
function go(i,dir){if(i<0||i>=SLIDES.length)return;const d=dir||(i>idx?1:i<idx?-1:0);idx=i;localStorage.setItem("smoat-redesign-review-idx",idx);const s=SLIDES[idx];const {g,k}=curGroup(idx);const img=document.getElementById("img");img.src=s.file;img.classList.remove("anim-next","anim-prev");void img.offsetWidth;if(d>0)img.classList.add("anim-next");else if(d<0)img.classList.add("anim-prev");document.getElementById("num").textContent=(idx+1)+" / "+SLIDES.length;document.getElementById("chip").textContent=(g.no==="0"?"":g.no+" ")+g.name;document.getElementById("step").textContent=(idx-g.start+1)+" / "+g.count;document.getElementById("title").textContent=s.title;document.getElementById("file").textContent=s.file;document.getElementById("jump").value=idx+1;document.getElementById("allbar").style.width=((idx+1)/SLIDES.length*100)+"%";segEls.forEach((el,gi)=>{el.classList.toggle("cur",gi===k);el.classList.toggle("done",gi<k);const gg=GROUPS[gi];const fill=el.querySelector(".fill");if(gi<k)fill.style.width="100%";else if(gi===k)fill.style.width=((idx-gg.start+1)/gg.count*100)+"%";else fill.style.width="0";});for(let p=1;p<=3;p++){if(idx+p<SLIDES.length){const im=new Image();im.src=SLIDES[idx+p].file;}}}
document.addEventListener("keydown",(e)=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();go(idx+1,1);}else if(e.key==="ArrowLeft"){e.preventDefault();go(idx-1,-1);}else if(e.key==="Home")go(0);else if(e.key==="End")go(SLIDES.length-1);else if(e.key==="PageDown"){const {k}=curGroup(idx);if(GROUPS[k+1])go(GROUPS[k+1].start,1);}else if(e.key==="PageUp"){const {g,k}=curGroup(idx);go(idx>g.start?g.start:(GROUPS[k-1]?GROUPS[k-1].start:0),-1);}});
