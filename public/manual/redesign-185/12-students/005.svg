<text font-size="25" font-weight="850" fill="#243247"><tspan x="306" y="533">과제 배포는 시험지 관리·학생 관리 어디서든 시작할 수 있습니다.</tspan></text><rect x="164" y="634" width="1380" height="112" rx="8" fill="#ffffff" stroke="#d9e2ef" filter="url(#cardShadow)"/>
