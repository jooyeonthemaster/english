# SMOAT 학생 앱 — Android 릴리스 APK 빌드/서명 (CI 스테이징본)
#
# 스테이징본입니다. 활성화하려면 저장소 루트 .github/workflows/ 로 복사하십시오(README 참조).
#
# 트리거: mobile-v* 태그 푸시 또는 수동 실행. repo variable ANDROID_SIGNING_ENABLED == 'true'
# 일 때만 잡이 돕니다. 서명 계정/시크릿이 없으면 잡이 스킵되어 그린을 유지합니다.
#
# 서명은 build.gradle 을 편집하지 않고 -Pandroid.injected.signing.* 프로퍼티 주입으로 처리합니다
# (작동 중인 build.gradle 무편집 원칙 — assembleDebug/Release 그린 보존).

name: mobile-android-release

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    # 서명 활성화 게이트. 미설정 시 잡 전체 스킵(그린 유지).
    if: ${{ vars.ANDROID_SIGNING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Assemble release APK (signed via injected properties)
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
