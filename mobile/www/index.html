<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>SMOAT 학습</title>
  <!--
    최소 스텁. server.url(https://www.smoat.co.kr/g)이 초기 로드를 가로채므로
    이 파일은 런타임에 표시되지 않는다 — webDir(www) 존재 요건 충족용일 뿐이다.
    redirect 스크립트는 두지 않는다(원격 이동은 server.url 이 처리한다).
    실제 로컬 폴백 화면은 offline.html(server.errorPath)이다.
  -->
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      /* gd.css --gd-paper 실측: 원격 페인트 전 백지 대신 지면색으로 흰 플래시 제거 */
      background: #f6f5f1;
      color: #98a0ad; /* gd.css --gd-ink-3 */
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
      line-height: 1.5;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }
    p { margin: 0; font-size: 0.875rem; }
  </style>
</head>
<body>
  <p>SMOAT 학습을 불러오는 중입니다…</p>
</body>
</html>
