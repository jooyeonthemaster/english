<!-- @dsCard group="Patterns" -->
<title>모바일 스텝 플로우</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#F8FAFC;color:#111827;padding:28px;-webkit-font-smoothing:antialiased}
h1{font-size:15px;font-weight:800;margin-bottom:4px}
p.note{font-size:12px;color:#6B7280;margin-bottom:20px}
.phone{max-width:390px;border:1px solid #E2E8F0;border-radius:16px;background:#F8FAFC;overflow:hidden;display:flex;flex-direction:column;height:420px}
.stepper{margin:12px;border-radius:10px;border:1px solid #E2E8F0;background:#fff;padding:10px 8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.steps{display:flex;align-items:center}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.dot{display:flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:9999px;border:1px solid;font-size:12px;font-weight:700;transition:colors .15s}
.dot.done{border-color:#BFDBFE;background:#EFF6FF;color:#2563EB}
.dot.active{border-color:#2563EB;background:#2563EB;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.dot.wait{border-color:#E2E8F0;background:#fff;color:#94A3B8}
.step span{font-size:10px;font-weight:600;color:#64748B;white-space:nowrap}
.step span.on{color:#2563EB}
.line{height:2px;flex:1;border-radius:9999px;margin:0 6px 14px;background:#E2E8F0}
.line.past{background:#3B82F6}
.content{flex:1;margin:0 12px;border-radius:10px;border:1px dashed #CBD5E1;display:flex;align-items:center;justify-content:center;color:#94A3B8;font-size:12px}
.bottombar{border-top:1px solid #E2E8F0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);padding:10px 12px;display:flex;gap:8px}
.prev{display:inline-flex;height:44px;align-items:center;justify-content:center;gap:4px;border-radius:10px;border:1px solid #E2E8F0;background:#fff;padding:0 14px;font-size:13px;font-weight:600;font-family:inherit;color:#475569;cursor:pointer}
.prev:hover{background:#F8FAFC}
.next{display:inline-flex;height:44px;min-width:0;flex:1;align-items:center;justify-content:center;gap:4px;border-radius:10px;padding:0 16px;font-size:13.5px;font-weight:700;font-family:inherit;border:none;background:#2563EB;color:#fff;cursor:pointer}
.next:hover{background:#1D4ED8}
</style>
<h1>모바일 스텝 플로우 (한 화면 한 기능)</h1>
<p class="note">모바일은 단계당 한 기능. 상단 스테퍼(MobileStepHeader) + 하단 고정 이전/다음 바(MobileStepNav, safe-area 패딩). 비활성 다음 버튼 클릭 시 대상 요소에 파란 힌트 글로우.</p>

<div class="phone">
  <div class="stepper">
    <div class="steps">
      <div class="step"><div class="dot done"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><span>지문 선택</span></div>
      <div class="line past"></div>
      <div class="step"><div class="dot active">2</div><span class="on">옵션 설정</span></div>
      <div class="line"></div>
      <div class="step"><div class="dot wait">3</div><span>생성</span></div>
      <div class="line"></div>
      <div class="step"><div class="dot wait">4</div><span>확인</span></div>
    </div>
  </div>
  <div class="content">단계 콘텐츠 영역</div>
  <div class="bottombar">
    <button class="prev">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      이전
    </button>
    <button class="next">다음 단계로</button>
  </div>
</div>
