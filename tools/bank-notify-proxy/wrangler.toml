name = "smoat-bank-notify-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# SMOAT 입금 수신 엔드포인트 (배포 도메인으로 교체)
TARGET_URL = "https://smoat.co.kr/api/credits/top-ups/bank-notify"

# Secrets (do NOT put here — use `wrangler secret put`):
#   RELAY_SECRET  = SMOAT 의 BANK_NOTIFY_RELAY_SECRET 과 동일한 값
#   INGEST_TOKEN  = 폰 포워더가 보내는 Bearer 토큰 (아무 랜덤 문자열)
