<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SMOAT Coupon Mockup</title>
    <style>
      :root {
        --paper: #fffdf8;
        --ink: #071532;
        --muted: #6a7282;
        --blue: #56a4e8;
        --blue-deep: #075fca;
        --lime: #b9f20c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 18% 12%, rgba(86, 164, 232, 0.18), transparent 30%),
          radial-gradient(circle at 88% 18%, rgba(185, 242, 12, 0.12), transparent 24%),
          linear-gradient(135deg, #f7f2e9 0%, #ece6da 100%);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Noto Sans KR", "Malgun Gothic", sans-serif;
      }

      .stage {
        width: 1600px;
        height: 900px;
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(7, 21, 50, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(7, 21, 50, 0.03) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(circle at center, black 0 35%, transparent 72%);
      }

      .stack {
        position: relative;
        width: 1320px;
        height: 548px;
        transform: rotate(-2deg);
      }

      .shadow {
        position: absolute;
        inset: 34px 0 -28px 46px;
        border-radius: 40px;
        background: rgba(40, 34, 24, 0.2);
        filter: blur(34px);
        transform: rotate(3deg);
      }

      .back-card {
        position: absolute;
        inset: 44px 14px -32px 60px;
        border-radius: 36px;
        background:
          radial-gradient(circle at 13% 78%, transparent 0 66px, rgba(86, 164, 232, 0.14) 67px 69px, transparent 70px),
          linear-gradient(135deg, #fffefa, #f4f1ea);
        border: 1px solid rgba(7, 21, 50, 0.08);
        box-shadow: 0 14px 28px rgba(49, 43, 34, 0.14);
        transform: rotate(-3deg);
      }

      .coupon {
        position: absolute;
        inset: 0;
        border-radius: 38px;
        overflow: hidden;
        background:
          radial-gradient(circle at 7% 11%, transparent 0 92px, rgba(86, 164, 232, 0.15) 93px 95px, transparent 96px),
          radial-gradient(circle at 74% 8%, transparent 0 86px, rgba(86, 164, 232, 0.12) 87px 89px, transparent 90px),
          radial-gradient(circle at 20% 94%, transparent 0 100px, rgba(86, 164, 232, 0.12) 101px 103px, transparent 104px),
          linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(255, 253, 248, 0.98));
        border: 1px solid rgba(7, 21, 50, 0.12);
        box-shadow:
          0 44px 70px rgba(42, 36, 28, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.88);
      }

      .coupon::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(105deg, rgba(86, 164, 232, 0.08) 0 1px, transparent 1px 14px),
          repeating-linear-gradient(75deg, rgba(86, 164, 232, 0.06) 0 1px, transparent 1px 18px);
        mask-image: radial-gradient(circle at 11% 12%, black 0 150px, transparent 151px),
          radial-gradient(circle at 76% 10%, black 0 150px, transparent 151px),
          radial-gradient(circle at 19% 93%, black 0 160px, transparent 161px);
        opacity: 0.92;
        pointer-events: none;
      }

      .grain {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(rgba(7, 21, 50, 0.065) 0.65px, transparent 0.7px),
          radial-gradient(rgba(255, 255, 255, 0.68) 0.7px, transparent 0.75px);
        background-position: 0 0, 12px 18px;
        background-size: 24px 24px;
        opacity: 0.22;
        mix-blend-mode: multiply;
        pointer-events: none;
      }

      .main {
        position: absolute;
        left: 116px;
        top: 76px;
        width: 792px;
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .logo {
        width: 100px;
        height: 100px;
        border-radius: 21px;
        object-fit: cover;
        box-shadow:
          0 16px 26px rgba(5, 95, 202, 0.22),
          inset 0 0 0 1px rgba(255, 255, 255, 0.42);
      }

      .wordmark {
        display: grid;
        gap: 8px;
      }

      .wordmark strong {
        font-size: 64px;
        line-height: 0.88;
        letter-spacing: 0;
        font-weight: 900;
        color: var(--ink);
      }

      .wordmark span {
        font-size: 27px;
        font-weight: 780;
        color: #636b78;
      }

      .offer {
        margin: 36px 0 0;
        font-size: 52px;
        line-height: 1.08;
        letter-spacing: 0;
        font-weight: 950;
      }

      .offer em {
        color: var(--blue-deep);
        font-style: normal;
      }

      .rule {
        width: 710px;
        margin: 20px 0 22px;
        display: flex;
        align-items: center;
        gap: 18px;
        color: var(--blue-deep);
      }

      .rule::before,
      .rule::after {
        content: "";
        height: 2px;
        flex: 1;
        background: currentColor;
      }

      .rule span {
        font-size: 27px;
        transform: translateY(-1px);
      }

      .code {
        width: 660px;
        height: 90px;
        display: grid;
        place-items: center;
        color: white;
        background:
          radial-gradient(circle at left center, var(--paper) 0 18px, transparent 19px),
          radial-gradient(circle at right center, var(--paper) 0 18px, transparent 19px),
          linear-gradient(94deg, #0871df 0%, #075fc6 58%, #004bb5 100%);
        border-radius: 15px;
        font-size: 54px;
        font-weight: 950;
        letter-spacing: 0;
        box-shadow:
          0 18px 30px rgba(5, 95, 202, 0.24),
          inset 0 1px 0 rgba(255, 255, 255, 0.28);
      }

      .caption {
        margin-top: 18px;
        display: flex;
        align-items: center;
        gap: 19px;
        color: #333a47;
        font-size: 21px;
        font-weight: 740;
      }

      .gift {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        border-radius: 13px;
        background: var(--lime);
        color: var(--ink);
        box-shadow: 0 12px 18px rgba(145, 190, 0, 0.24);
      }

      .tear {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 920px;
        width: 2px;
        background: repeating-linear-gradient(
          to bottom,
          rgba(7, 21, 50, 0.35) 0 8px,
          transparent 8px 18px
        );
      }

      .tear::before,
      .tear::after {
        content: "";
        position: absolute;
        left: -17px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #eee8dc;
        box-shadow: inset 0 1px 1px rgba(7, 21, 50, 0.08);
      }

      .tear::before {
        top: -18px;
      }

      .tear::after {
        bottom: -18px;
      }

      .scan {
        position: absolute;
        right: 70px;
        top: 48px;
        width: 298px;
        text-align: center;
      }

      .scan-title {
        margin: 0 0 16px;
        color: var(--blue-deep);
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0;
      }

      .qr-card {
        position: relative;
        width: 228px;
        height: 228px;
        margin: 0 auto;
        display: grid;
        place-items: center;
        border-radius: 23px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(7, 21, 50, 0.13);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.85),
          0 18px 32px rgba(7, 21, 50, 0.08);
      }

      .qr {
        width: 176px;
        height: 176px;
      }

      .qr-logo {
        position: absolute;
        width: 46px;
        height: 46px;
        left: 91px;
        top: 91px;
        border-radius: 11px;
        border: 5px solid white;
      }

      .scan-note {
        margin: 16px 0 18px;
        font-size: 24px;
        font-weight: 870;
      }

      .button {
        width: 236px;
        height: 64px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        border-radius: 22px;
        background: linear-gradient(135deg, #0874e3, #0759c0);
        color: white;
        font-size: 26px;
        font-weight: 920;
        box-shadow: 0 19px 28px rgba(5, 95, 202, 0.24);
      }

      .url {
        margin-top: 17px;
        color: #1e2633;
        font-size: 22px;
        font-weight: 650;
      }

      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="SMOAT coupon mockup">
      <section class="stack">
        <div class="shadow"></div>
        <div class="back-card"></div>
        <article class="coupon">
          <div class="grain"></div>
          <div class="main">
            <div class="brand-row">
              <img class="logo" src="../../public/smoat-logo.png" alt="SMOAT logo" />
              <div class="wordmark">
                <strong>SMOAT</strong>
                <span>AI 영어 문제 생성 플랫폼</span>
              </div>
            </div>

            <h1 class="offer">무료 크레딧 <em>100</em> 지급권</h1>
            <div class="rule"><span>✦</span></div>
            <div class="code">WELCOME100</div>
            <p class="caption">
              <span class="gift" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                  <path d="M4 10h16v10H4V10Z" stroke="currentColor" stroke-width="2" />
                  <path d="M12 10v10M3 7h18v3H3V7Z" stroke="currentColor" stroke-width="2" />
                  <path d="M12 7c-2.8 0-5-1.1-5-2.6C7 3.1 8 2 9.2 2c1.5 0 2.3 1.4 2.8 5ZM12 7c2.8 0 5-1.1 5-2.6C17 3.1 16 2 14.8 2c-1.5 0-2.3 1.4-2.8 5Z" stroke="currentColor" stroke-width="2" />
                </svg>
              </span>
              더 스마트한 영어 학습, 스모트와 함께 시작하세요.
            </p>
          </div>

          <div class="tear"></div>

          <aside class="scan">
            <p class="scan-title">✦ SCAN &amp; GET ✦</p>
            <div class="qr-card">
              <svg class="qr" viewBox="0 0 100 100" aria-hidden="true">
                <rect width="100" height="100" fill="#fff" />
                <path d="M5 5h25v25H5zM11 11v13h13V11zM70 5h25v25H70zM76 11v13h13V11zM5 70h25v25H5zM11 76v13h13V76z" fill="#070707" />
                <path d="M39 6h7v7h-7zM53 6h6v7h-6zM62 14h7v6h-7zM35 20h6v7h-6zM48 22h11v6H48zM39 34h6v6h-6zM54 34h7v7h-7zM65 34h8v6h-8zM80 36h8v8h-8zM35 47h8v7h-8zM47 46h7v7h-7zM62 47h6v6h-6zM74 48h9v7h-9zM88 51h7v8h-7zM36 61h6v8h-6zM48 60h10v6H48zM65 60h7v7h-7zM78 63h7v7h-7zM90 66h5v8h-5zM36 78h9v7h-9zM49 75h7v7h-7zM60 73h8v8h-8zM74 78h7v7h-7zM86 82h9v7h-9zM39 90h6v5h-6zM53 88h8v7h-8zM68 90h8v5h-8z" fill="#070707" />
                <path d="M45 40h10v5H45zM42 52h7v6h-7zM55 54h8v6h-8zM66 43h7v7h-7z" fill="#070707" />
              </svg>
              <img class="qr-logo" src="../../public/smoat-logo.png" alt="" />
            </div>
            <p class="scan-note">QR 스캔 후 코드 입력</p>
            <div class="button">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 7h18v10H3V7Z" stroke="currentColor" stroke-width="2" />
                <path d="M8 7a3 3 0 0 1-3 3M19 10a3 3 0 0 1-3-3M5 14a3 3 0 0 1 3 3M16 17a3 3 0 0 1 3-3" stroke="currentColor" stroke-width="2" />
                <path d="M9 12h6" stroke="currentColor" stroke-width="2" />
              </svg>
              쿠폰 등록
            </div>
            <p class="url">smoat.kr/coupon</p>
          </aside>
        </article>
      </section>
    </main>
  </body>
</html>
