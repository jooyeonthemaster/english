name: CI

on:
  push:
    branches: [main]
  pull_request:

# 진행 중인 동일 브랜치 실행은 취소하고 최신 것만 남긴다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · test · lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # prisma generate 는 postinstall 에서 자동 실행된다.
      - name: Install dependencies
        run: npm ci

      # 하드 게이트 1: 타입 검사 (next.config.ts 의 빌드 게이트와 동일 기준)
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # 하드 게이트 2: 단위 테스트 (AI 생성 품질 회귀 방지 자산)
      - name: Unit tests
        run: npm run test:unit

      # 정보성(비차단): 리포 관례상 lint 는 빌드 게이트가 아니다. 기존
      # 미해결 경고/에러가 있어 실패해도 CI 를 막지 않되 로그로 가시화한다.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
