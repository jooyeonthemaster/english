<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMOAT LINE — 영어 강사 내신 대비 올인원 세미나</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%233B82F6'/%3E%3Crect x='12' y='30' width='40' height='4' rx='2' fill='%23fff'/%3E%3Ccircle cx='18' cy='32' r='6' fill='%23fff'/%3E%3Ccircle cx='46' cy='32' r='6' fill='%23BFDBFE'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Archivo:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/deck.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="glow-bg"></div>
    <div id="grid-bg"></div>

<!--SLIDES-->

    <div id="gridflash"></div>
    <div id="sweep"></div>
    <div id="osd"></div>

    <div id="hud">
      <div id="hud-top">
        <div id="hud-row">
          <span id="hud-brand">
            <span class="mark">SMOAT<i>LINE</i></span>
            <span id="hud-zone"></span>
            <span id="hud-st"></span>
          </span>
          <span id="hud-right">
            <span id="hud-live"><span class="dot"></span><span id="hud-part"></span></span>
            <span id="hud-tc">00:00:00</span>
          </span>
        </div>
        <div id="rail"></div>
      </div>
    </div>

    <div id="readout">
      <span class="side"><span class="lab lab--in">IN</span><span class="val" id="ro-in">—</span></span>
      <span class="flow"></span>
      <span class="side"><span class="lab lab--out">OUT</span><span class="val" id="ro-out">—</span></span>
      <span class="note" id="ro-note"></span>
    </div>

    <div id="linemap">
      <h2>LINE MAP — 공정도</h2>
      <div class="sub">지문 한 장이 라인에 올라 어디까지 흐르는지. 칸을 누르면 그 공정으로 이동합니다.</div>
      <div class="zones"></div>
      <div class="loop"><span>↺ 회수된 취약점은 다시 라인 입구로 — 라인은 닫히지 않는다</span><span class="bar"></span></div>
      <div class="hint">G · ESC 닫기 &nbsp;|&nbsp; ← → 이동 &nbsp;|&nbsp; 숫자키 점프 &nbsp;|&nbsp; F 전체화면</div>
    </div>
  </div>
</div>
<script src="assets/js/deck.js"></script>
</body>
</html>
